services:
  mysql:
    image: mysql:8
    container_name: steadica-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: steadica_f79666dc
    ports:
      - "3306:3306"
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    container_name: steadica-frontend
    ports:
      - "4000:4000"
    environment:
      - VITE_API_URL=http://backend:3001
    networks:
      - appnet
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: steadica-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DB=steadica_f79666dc
    networks:
      - appnet
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  appnet:
    driver: bridge